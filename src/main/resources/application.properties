spring.application.name=coleta-plus

# CONFIGURAÇÃO BÁSICA DO SPRING
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${DB_USERNAME:*******}
spring.datasource.password=${DB_PASSWORD:*******}

# MOSTRAR AS INSTRUÇÕES SQL EXECUTADAS NO BANCO DE DADOS
spring.jpa.show-sql=${SHOW_SQL:true}

# QUEBRAR A EXIBIÇÃO DA INSTRUÇÃO SQL EM VÁRIAS LINHAS
spring.jpa.properties.hibernate.format_sql=true

# CONFIGURAÇÃO PARA O ORACLE DATABASE
# CRIAR A TABELA DE CONTROLE DE MIGRAÇÃO NO BANCO DE DADOS
spring.flyway.baseline-on-migrate=true

# REMOVER O CAMPO "trace" DA RESPOSTA DE ERRO
spring.web.error.include-stacktrace=never

# PALAVRA SECRETA PARA GERAR TOKEN
minha.palavra.secreta=${JWT_SECRET:fiap}

# OBSERVABILIDADE (usado pelos healthchecks do Docker e pelo smoke test do pipeline)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=Coleta+ ESG API
info.app.environment=${APP_ENV:local}
info.app.version=${APP_VERSION:dev}
