#cloud-config
# Executado no primeiro boot da VM: instala Docker + Compose e cria 4 GB de swap
# (o Oracle Free consome bastante memoria).
# ATENCAO: mantenha este arquivo apenas com caracteres ASCII (sem acentos);
# acentos corrompem o YAML enviado via --custom-data e a VM ignora o arquivo.
package_update: true
runcmd:
  - curl -fsSL https://get.docker.com | sh
  - usermod -aG docker azureuser
  - systemctl enable --now docker
  - fallocate -l 4G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
  - echo '/swapfile none swap sw 0 0' >> /etc/fstab
