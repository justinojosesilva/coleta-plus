name: CI/CD - Coleta+ ESG

# Push na main  -> build + testes -> imagem Docker -> deploy staging -> (aprovação) -> deploy produção
# Pull request  -> só build + testes (validação antes do merge)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false   # nunca interrompe um deploy pela metade

jobs:
  # ---------------------------------------------------------------- 1. BUILD + TESTES
  build-test:
    name: Build & testes
    runs-on: ubuntu-latest

    # Banco Oracle real para os testes de integração (*IT.java)
    services:
      oracle:
        image: gvenzl/oracle-free:23-slim-faststart
        env:
          ORACLE_PASSWORD: oracle
          APP_USER: coleta
          APP_USER_PASSWORD: coleta
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 60s

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar, testes unitários e de integração (mvn verify)
        run: |
          chmod +x mvnw
          ./mvnw -B verify
        env:
          DB_URL: jdbc:oracle:thin:@localhost:1521/FREEPDB1
          DB_USERNAME: coleta
          DB_PASSWORD: coleta
          JWT_SECRET: ci-secret

      - name: Resumo dos testes
        if: always()
        run: |
          {
            echo "### Resultado dos testes"
            echo "| Suite | Testes | Falhas | Erros |"
            echo "|---|---|---|---|"
            for f in target/surefire-reports/TEST-*.xml target/failsafe-reports/TEST-*.xml; do
              [ -f "$f" ] || continue
              name=$(grep -o 'testsuite [^>]*name="[^"]*"' "$f" | head -1 | sed 's/.*name="\([^"]*\)"/\1/')
              tests=$(grep -o 'tests="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
              fails=$(grep -o 'failures="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
              errs=$(grep -o 'errors="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
              echo "| ${name##*.} | $tests | $fails | $errs |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar relatórios de teste
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-de-teste
          path: |
            target/surefire-reports/
            target/failsafe-reports/

      - name: Publicar .jar
        uses: actions/upload-artifact@v7
        with:
          name: coleta-plus-jar
          path: target/coleta-plus-*.jar

  # ---------------------------------------------------------------- 2. IMAGEM DOCKER
  docker:
    name: Imagem Docker (GHCR)
    needs: build-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Definir nome e tag da imagem
        id: vars
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAG="sha-${GITHUB_SHA::7}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ steps.vars.outputs.tag }}
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumo
        run: echo "Imagem publicada - \`${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------- 3. DEPLOY STAGING
  deploy-staging:
    name: Deploy staging
    needs: docker
    if: vars.VM_HOST != ''          # só roda depois que a VM do Azure estiver configurada
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      port: 8081
      image: ${{ needs.docker.outputs.image }}:${{ needs.docker.outputs.tag }}
      version: ${{ needs.docker.outputs.tag }}
    secrets: inherit

  # ---------------------------------------------------------------- 4. DEPLOY PRODUÇÃO
  # Mesma imagem validada em staging. O environment "production" exige aprovação manual.
  deploy-production:
    name: Deploy produção
    needs: [docker, deploy-staging]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      port: 8080
      image: ${{ needs.docker.outputs.image }}:${{ needs.docker.outputs.tag }}
      version: ${{ needs.docker.outputs.tag }}
    secrets: inherit
